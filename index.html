<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Distribution Attendance</title>
    <!-- Tailwind CSS for Responsive Mobile & Web Design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

    <!-- Header Navigation -->
    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid font-bold fa-utensils"></i> Food Distribution Tracker
            </h1>
            <!-- Switcher Tabs -->
            <div class="flex bg-indigo-800 p-1 rounded-lg text-sm w-full sm:w-auto">
                <button id="tab-member" onclick="switchTab('member')" class="flex-1 sm:flex-initial px-4 py-2 rounded-md font-medium transition bg-white text-indigo-900 shadow">
                    <i class="fa-solid fa-user-check mr-1"></i> Member View
                </button>
                <button id="tab-admin" onclick="switchTab('admin')" class="flex-1 sm:flex-initial px-4 py-2 rounded-md font-medium transition text-indigo-200 hover:text-white">
                    <i class="fa-solid fa-user-gear mr-1"></i> Admin Panel
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 md:p-6">

        <p id="firebase-status" role="status" aria-live="polite" class="mb-4 text-sm text-slate-500">Connecting to Firebase...</p>

        <!-- ================= MEMBER SECTION ================= -->
        <section id="section-member" class="space-y-6">
            
            <!-- Ministry Counter Cards -->
            <div>
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-500 mb-3">Attendance Summary</h2>
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 md:gap-4">
                    <!-- JAM Stats -->
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 text-center">
                        <span class="inline-block px-2 py-1 text-xs font-bold bg-amber-100 text-amber-700 rounded-md mb-1">JAM</span>
                        <div id="count-jam" class="text-2xl md:text-3xl font-extrabold text-slate-800">0</div>
                        <span class="text-xs text-slate-500">Present</span>
                    </div>
                    <!-- VIA Stats -->
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 text-center">
                        <span class="inline-block px-2 py-1 text-xs font-bold bg-emerald-100 text-emerald-700 rounded-md mb-1">VIA</span>
                        <div id="count-via" class="text-2xl md:text-3xl font-extrabold text-slate-800">0</div>
                        <span class="text-xs text-slate-500">Present</span>
                    </div>
                    <!-- DANCE Stats -->
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 text-center">
                        <span class="inline-block px-2 py-1 text-xs font-bold bg-purple-100 text-purple-700 rounded-md mb-1">DANCE</span>
                        <div id="count-dance" class="text-2xl md:text-3xl font-extrabold text-slate-800">0</div>
                        <span class="text-xs text-slate-500">Present</span>
                    </div>
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 text-center">
                        <span class="inline-block px-2 py-1 text-xs font-bold bg-sky-100 text-sky-700 rounded-md mb-1">MAN</span>
                        <div id="count-man" class="text-2xl md:text-3xl font-extrabold text-slate-800">0</div>
                        <span class="text-xs text-slate-500">Present</span>
                    </div>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="member-search" oninput="renderMemberList()" placeholder="Search your name..." class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white text-base">
                </div>
            </div>

            <!-- Member List for Attendance -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-4 border-b border-slate-100 flex justify-between items-center">
                    <h3 class="font-bold text-slate-700">Member List</h3>
                    <span id="total-present-tag" class="text-xs bg-indigo-50 text-indigo-600 px-2.5 py-1 rounded-full font-medium">0 Present Total</span>
                </div>
                <ul id="member-list-display" class="divide-y divide-slate-100">
                    <!-- Populated dynamically by JavaScript -->
                </ul>
            </div>
        </section>


        <!-- ================= ADMIN SECTION ================= -->
        <section id="section-admin" class="hidden space-y-6">
            
            <!-- Add New Member Form -->
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-user-plus text-indigo-600"></i> Add New Member
                </h2>
                <form id="add-member-form" onsubmit="handleAddMember(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Full Name</label>
                        <input type="text" id="input-name" required placeholder="Enter member's full name" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Ministry</label>
                        <select id="input-ministry" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                            <option value="JAM">JAM</option>
                            <option value="VIA">VIA</option>
                            <option value="DANCE">DANCE</option>
                            <option value="MAN">MAN</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition shadow">
                        Add Member
                    </button>
                </form>
            </div>

            <!-- Manage Members List -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-4 border-b border-slate-100 flex justify-between items-center">
                    <h3 class="font-bold text-slate-700">All Registered Members</h3>
                    <button onclick="resetAllAttendance()" class="text-xs text-red-600 hover:text-red-800 bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-md font-medium transition">
                        Reset All Attendance
                    </button>
                </div>
                <ul id="admin-list-display" class="divide-y divide-slate-100">
                    <!-- Populated dynamically by JavaScript -->
                </ul>
            </div>
        </section>

        <dialog id="edit-member-dialog" class="w-[calc(100%-2rem)] max-w-md rounded-xl p-0 shadow-xl backdrop:bg-slate-900/50">
            <form id="edit-member-form" onsubmit="handleEditMember(event)" class="space-y-4 p-5">
                <h2 class="text-lg font-bold text-slate-800">Edit Member</h2>
                <div>
                    <label for="edit-name" class="mb-1 block text-sm font-medium text-slate-700">Full Name</label>
                    <input id="edit-name" type="text" required class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label for="edit-ministry" class="mb-1 block text-sm font-medium text-slate-700">Ministry</label>
                    <select id="edit-ministry" required class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="JAM">JAM</option>
                        <option value="VIA">VIA</option>
                        <option value="DANCE">DANCE</option>
                        <option value="MAN">MAN</option>
                    </select>
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="document.getElementById('edit-member-dialog').close()" class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">Cancel</button>
                    <button type="submit" class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700">Save Changes</button>
                </div>
            </form>
        </dialog>

    </main>

    <!-- JavaScript Application Logic -->
    <script>
        // Sample Initial Data if empty
        const initialMembers = [
            { id: '1', name: 'John Doe', ministry: 'JAM', present: false },
            { id: '2', name: 'Maria Santos', ministry: 'VIA', present: false },
            { id: '3', name: 'Alex Reyes', ministry: 'DANCE', present: false }
        ];

        const firebaseMembersUrl = 'https://food-ee270-default-rtdb.firebaseio.com/members.json';
        const firebaseStatus = document.getElementById('firebase-status');
        let members = [];
        let firebaseWriteQueue = Promise.resolve();
        let editingMemberId = null;

        function setFirebaseStatus(message, isError = false) {
            firebaseStatus.textContent = message;
            firebaseStatus.className = `mb-4 text-sm ${isError ? 'text-red-600' : 'text-slate-500'}`;
        }

        // Save locally as a fallback, then persist the same snapshot to Firebase.
        function saveData() {
            const snapshot = members.map(member => ({ ...member }));
            try {
                localStorage.setItem('food_dist_members', JSON.stringify(snapshot));
            } catch (error) {
                console.warn('Could not save the local backup:', error);
            }
            updateUI();

            firebaseWriteQueue = firebaseWriteQueue.then(async () => {
                setFirebaseStatus('Saving changes to Firebase...');
                const response = await fetch(firebaseMembersUrl, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(snapshot)
                });
                if (!response.ok) {
                    throw new Error(`Firebase returned ${response.status}`);
                }
                setFirebaseStatus('All changes saved to Firebase.');
            }).catch(error => {
                console.error('Firebase save failed:', error);
                setFirebaseStatus('Firebase save failed. Changes are only in this browser; check database rules and connection.', true);
            });
        }

        async function loadMembers() {
            try {
                const response = await fetch(firebaseMembersUrl);
                if (!response.ok) {
                    throw new Error(`Firebase returned ${response.status}`);
                }

                const remoteMembers = await response.json();
                if (Array.isArray(remoteMembers)) {
                    members = remoteMembers;
                    localStorage.setItem('food_dist_members', JSON.stringify(members));
                    setFirebaseStatus('Connected to Firebase.');
                    updateUI();
                    return;
                }

                const localMembers = JSON.parse(localStorage.getItem('food_dist_members'));
                members = Array.isArray(localMembers) ? localMembers : initialMembers;
                saveData();
            } catch (error) {
                console.error('Firebase load failed:', error);
                try {
                    const localMembers = JSON.parse(localStorage.getItem('food_dist_members'));
                    members = Array.isArray(localMembers) ? localMembers : initialMembers;
                } catch {
                    members = initialMembers;
                }
                setFirebaseStatus('Could not connect to Firebase. Showing browser-saved data; changes may not sync.', true);
                updateUI();
            }
        }

        // Switch between Member and Admin Tabs
        function switchTab(tab) {
            const memberSec = document.getElementById('section-member');
            const adminSec = document.getElementById('section-admin');
            const tabMemberBtn = document.getElementById('tab-member');
            const tabAdminBtn = document.getElementById('tab-admin');

            if (tab === 'member') {
                memberSec.classList.remove('hidden');
                adminSec.classList.add('hidden');
                
                tabMemberBtn.className = "flex-1 sm:flex-initial px-4 py-2 rounded-md font-medium transition bg-white text-indigo-900 shadow";
                tabAdminBtn.className = "flex-1 sm:flex-initial px-4 py-2 rounded-md font-medium transition text-indigo-200 hover:text-white";
            } else {
                adminSec.classList.remove('hidden');
                memberSec.classList.add('hidden');

                tabAdminBtn.className = "flex-1 sm:flex-initial px-4 py-2 rounded-md font-medium transition bg-white text-indigo-900 shadow";
                tabMemberBtn.className = "flex-1 sm:flex-initial px-4 py-2 rounded-md font-medium transition text-indigo-200 hover:text-white";
            }
        }

        // Toggle Present state for a member
        function toggleAttendance(id) {
            members = members.map(member => {
                if (member.id === id) {
                    return { ...member, present: !member.present };
                }
                return member;
            });
            saveData();
        }

        // Add a new member (Admin)
        function handleAddMember(e) {
            e.preventDefault();
            const nameInput = document.getElementById('input-name');
            const ministryInput = document.getElementById('input-ministry');

            const newMember = {
                id: Date.now().toString(),
                name: nameInput.value.trim(),
                ministry: ministryInput.value,
                present: false
            };

            members.push(newMember);
            saveData();

            // Clear Input
            nameInput.value = '';
            alert(`${newMember.name} added to ${newMember.ministry}!`);
        }

        function openEditMember(id) {
            const member = members.find(item => item.id === id);
            if (!member) return;

            editingMemberId = id;
            document.getElementById('edit-name').value = member.name;
            document.getElementById('edit-ministry').value = member.ministry;
            document.getElementById('edit-member-dialog').showModal();
        }

        function handleEditMember(e) {
            e.preventDefault();
            const name = document.getElementById('edit-name').value.trim();
            const ministry = document.getElementById('edit-ministry').value;
            members = members.map(member => member.id === editingMemberId
                ? { ...member, name, ministry }
                : member
            );
            editingMemberId = null;
            document.getElementById('edit-member-dialog').close();
            saveData();
        }

        // Delete a member (Admin)
        function deleteMember(id) {
            if (confirm("Are you sure you want to delete this member?")) {
                members = members.filter(m => m.id !== id);
                saveData();
            }
        }

        // Reset all attendance flags (Admin)
        function resetAllAttendance() {
            if (confirm("Reset attendance status for ALL members?")) {
                members = members.map(m => ({ ...m, present: false }));
                saveData();
            }
        }

        // Get badge color CSS class based on ministry
        function getMinistryBadgeClass(ministry) {
            switch(ministry) {
                case 'JAM': return 'bg-amber-100 text-amber-700';
                case 'VIA': return 'bg-emerald-100 text-emerald-700';
                case 'DANCE': return 'bg-purple-100 text-purple-700';
                case 'MAN': return 'bg-sky-100 text-sky-700';
                default: return 'bg-slate-100 text-slate-700';
            }
        }

        // Render Member View
        function renderMemberList() {
            const searchQuery = document.getElementById('member-search').value.toLowerCase();
            const listContainer = document.getElementById('member-list-display');
            listContainer.innerHTML = '';

            const filteredMembers = members.filter(m => m.name.toLowerCase().includes(searchQuery));

            if (filteredMembers.length === 0) {
                listContainer.innerHTML = `<li class="p-6 text-center text-slate-400">No members found</li>`;
                return;
            }

            filteredMembers.forEach(member => {
                const badgeClass = getMinistryBadgeClass(member.ministry);
                const isPresent = member.present;

                const li = document.createElement('li');
                li.className = "p-4 flex items-center justify-between hover:bg-slate-50 transition";
                li.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div>
                            <p class="font-semibold text-slate-800 ${isPresent ? 'line-through text-slate-400' : ''}">${member.name}</p>
                            <span class="inline-block text-[10px] px-2 py-0.5 rounded-full font-bold ${badgeClass}">${member.ministry}</span>
                        </div>
                    </div>
                    <button onclick="toggleAttendance('${member.id}')" 
                        class="flex items-center gap-2 px-4 py-2 rounded-lg font-medium text-sm transition ${
                            isPresent 
                            ? 'bg-emerald-600 text-white shadow-sm' 
                            : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                        }">
                        <i class="fa-solid ${isPresent ? 'fa-circle-check text-white' : 'fa-circle-user text-slate-400'}"></i>
                        <span>${isPresent ? 'Present' : 'Mark Present'}</span>
                    </button>
                `;
                listContainer.appendChild(li);
            });
        }

        // Render Admin View List
        function renderAdminList() {
            const listContainer = document.getElementById('admin-list-display');
            listContainer.innerHTML = '';

            if (members.length === 0) {
                listContainer.innerHTML = `<li class="p-6 text-center text-slate-400">No registered members. Add one above!</li>`;
                return;
            }

            members.forEach(member => {
                const badgeClass = getMinistryBadgeClass(member.ministry);

                const li = document.createElement('li');
                li.className = "p-4 flex items-center justify-between hover:bg-slate-50 transition";
                li.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div>
                            <p class="font-semibold text-slate-800">${member.name}</p>
                            <span class="inline-block text-[10px] px-2 py-0.5 rounded-full font-bold ${badgeClass}">${member.ministry}</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-1">
                        <button onclick="openEditMember('${member.id}')" class="rounded-lg px-3 py-2 text-sm font-medium text-indigo-600 hover:bg-indigo-50" title="Edit Member">
                            <i class="fa-solid fa-pen-to-square mr-1" aria-hidden="true"></i>Edit
                        </button>
                        <button onclick="deleteMember('${member.id}')" class="rounded-lg p-2 text-slate-400 transition hover:bg-red-50 hover:text-red-600" title="Delete Member" aria-label="Delete ${member.name}">
                            <i class="fa-solid fa-trash-can" aria-hidden="true"></i>
                        </button>
                    </div>
                `;
                listContainer.appendChild(li);
            });
        }

        // Update Statistics Counters
        function updateCounters() {
            const counts = { JAM: 0, VIA: 0, DANCE: 0, MAN: 0 };
            let totalPresent = 0;

            members.forEach(m => {
                if (m.present) {
                    counts[m.ministry] = (counts[m.ministry] || 0) + 1;
                    totalPresent++;
                }
            });

            document.getElementById('count-jam').textContent = counts.JAM;
            document.getElementById('count-via').textContent = counts.VIA;
            document.getElementById('count-dance').textContent = counts.DANCE;
            document.getElementById('count-man').textContent = counts.MAN;
            document.getElementById('total-present-tag').textContent = `${totalPresent} Present Total`;
        }

        // Refresh UI
        function updateUI() {
            renderMemberList();
            renderAdminList();
            updateCounters();
        }

        // Initial Load
        updateUI();
        loadMembers();
    </script>
</body>
</html>
